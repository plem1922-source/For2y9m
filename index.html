<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff5ea">
  <meta name="robots" content="noindex, nofollow">
  <title>Happy Anniversary 💚</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-scene="intro">

  <!-- พื้นหลัง -->
  <div id="bg" aria-hidden="true"></div>

  <!-- ===================== ฉากที่ 1 : หน้าเปิด ===================== -->
  <section class="scene active" id="scene-intro" aria-label="หน้าเปิด">
    <div class="scene-inner intro-inner">
      <p class="kicker" id="introKicker"></p>

      <button class="cover-btn" id="coverBtn" type="button" aria-label="แตะที่รูปเพื่อรับหัวใจ">
        <figure class="polaroid cover-polaroid" id="coverPhoto" style="--tilt:-2deg"></figure>
      </button>

      <div class="badge" id="introDuration"></div>
      <p class="for-who" id="introForWho"></p>

      <button class="btn pulse" id="openBtn" type="button"></button>
    </div>
  </section>

  <!-- ===================== ฉากที่ 2 : การ์ดข้อความ ===================== -->
  <section class="scene" id="scene-cards" aria-label="การ์ดข้อความ">
    <div class="scene-inner cards-inner">
      <div class="dots" id="dots" aria-hidden="true"></div>

      <div class="card-area" id="cardArea">
        <div class="card" id="card" role="button" tabindex="0" aria-label="แตะเพื่อเปิดการ์ด">
          <div class="card-inside">
            <div class="card-text" id="cardText" aria-live="polite"></div>
            <div class="card-heart" data-heart></div>
          </div>
          <div class="card-cover">
            <div class="cover-front">
              <span class="cover-flower cf-tl" data-flower="pink" aria-hidden="true"></span>
              <span class="cover-flower cf-br" data-flower="cream" aria-hidden="true"></span>
              <div class="seal" data-heart aria-hidden="true"></div>
              <div class="cover-no" id="coverNo"></div>
              <div class="hint">แตะเพื่อเปิด</div>
            </div>
          </div>
        </div>
        <figure class="polaroid card-photo" id="cardPhoto"></figure>
      </div>

      <button class="btn next-btn" id="nextBtn" type="button" hidden>ใบต่อไป 💌</button>
    </div>
  </section>

  <!-- ===================== ฉากที่ 3 : ตัวนับเวลา ===================== -->
  <section class="scene" id="scene-counter" aria-label="ตัวนับเวลาที่อยู่ด้วยกัน">
    <div class="scene-inner counter-inner">
      <h2 class="counter-title" id="counterTitle"></h2>
      <figure class="polaroid counter-photo" id="counterPhoto"></figure>
      <p class="since">ตั้งแต่ <b id="sinceLabel"></b></p>
      <div class="counter-grid" id="counterGrid" role="timer" aria-live="off"></div>
      <p class="total">รวมแล้ว <b id="totalDays">0</b> วัน</p>
      <button class="btn pulse" id="toFinalBtn" type="button"></button>
    </div>
  </section>

  <!-- ===================== ฉากที่ 4 : เซอร์ไพรส์ตอนท้าย ===================== -->
  <section class="scene" id="scene-final" aria-label="ข้อความสุดท้าย">
    <div class="scene-inner final-inner">
      <figure class="polaroid final-photo" id="finalPhoto"></figure>
      <h1 class="final-text" id="finalText"></h1>
      <button class="btn ghost" id="replayBtn" type="button"></button>
    </div>
  </section>

  <!-- ดอกไม้ตกแต่ง (แตะได้) -->
  <div id="deco" aria-hidden="true">
    <button class="deco d-tl" data-flower="pink" tabindex="-1" type="button"></button>
    <button class="deco d-tr" data-flower="mint" tabindex="-1" type="button"></button>
    <button class="deco d-bl" data-flower="mint" tabindex="-1" type="button"></button>
    <button class="deco d-br" data-flower="pink" tabindex="-1" type="button"></button>
  </div>

  <!-- ชั้นเอฟเฟกต์หัวใจ -->
  <div id="fx" aria-hidden="true"></div>

  <!-- ทรานซิชันหัวใจกวาดหน้าจอ -->
  <div id="wipe" aria-hidden="true"></div>
</div>

<!-- เพลงพื้นหลัง: ไม่มีปุ่ม เริ่มเล่นเมื่อแตะเปิดการ์ดใบแรก -->
<audio id="bgm" preload="auto" playsinline></audio>

<noscript><p style="padding:24px;font-family:sans-serif">กรุณาเปิด JavaScript เพื่อดูเว็บไซต์นี้ 💚</p></noscript>

<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
